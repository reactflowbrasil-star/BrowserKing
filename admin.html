<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HatClaw Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><header><div><span class="eyebrow">HATCLAW / ADMIN</span><h1>Painel de controle</h1><p>Licenças, dispositivos e auditoria em um só lugar.</p></div><button id="authButton">Configurar token</button></header><section id="auth" class="card"><label>Token administrativo/API</label><input id="token" type="password" placeholder="Bearer token"><button id="saveToken">Entrar</button><small>O token fica somente nesta sessão do navegador.</small></section><section id="dashboard" hidden><div class="stats"><article><b id="licenseCount">0</b><span>Licenças</span></article><article><b id="activeCount">0</b><span>Ativas</span></article><article><b id="deviceCount">0</b><span>Dispositivos</span></article><article><b id="auditCount">0</b><span>Eventos auditados</span></article></div><div class="toolbar"><h2>Licenças</h2><button id="newLicense">+ Nova licença</button><button id="refresh">Atualizar</button></div><div id="licenses" class="table"></div><div class="toolbar"><h2>Dispositivos</h2></div><div id="devices" class="table"></div><div class="toolbar"><h2>Auditoria</h2></div><div id="audit" class="table"></div></section></main><dialog id="licenseDialog"><form method="dialog" id="licenseForm"><h2>Nova licença</h2><input id="customerId" placeholder="ID do cliente" required><select id="plan"><option>basic</option><option>pro</option><option>team</option></select><input id="deviceLimit" type="number" min="1" value="1"><input id="expiresAt" type="date" required><menu><button value="cancel">Cancelar</button><button id="createLicense" value="default">Criar e gerar código</button></menu></form></dialog><script src="admin.js"></script></body></html>
